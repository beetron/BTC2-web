name: PR Review

# Runs on every PR into main (including each new push to the PR's branch,
# e.g. development), on PRs into development (Dependabot's update PRs), and
# on pushes to main so CodeQL has a baseline to compare against.
on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same PR/branch
concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # esbuild (used by Vite) ships prebuilt binaries as optional
      # dependencies, so install scripts can stay off here too
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # tsc -b, then the same production build the Docker image runs
      - name: Build
        run: npm run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Fails on high or critical advisories. Moderate/low are reported but do not block.
      - name: Run npm audit
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Community rule packs for a React + TypeScript browser app. --error fails the job on any finding.
      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/secrets
          --metrics off
          --error
